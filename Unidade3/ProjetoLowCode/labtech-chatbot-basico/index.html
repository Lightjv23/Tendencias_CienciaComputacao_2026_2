<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Assistente Acadêmico | LabTech</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="layout" id="layout">

  <aside class="sidebar">
    <div class="agent">
      <span class="avatar-logo"><img src="logo.svg" alt="Logo LabTech"></span>
      <div>
        <b>Assistente Acadêmico</b>
        <p>Assistente virtual para esclarecer dúvidas acadêmicas.</p>
      </div>
    </div>

    <div class="conv-head">
      <h2>Conversas</h2>
      <button id="newChat" title="Nova conversa" aria-label="Nova conversa">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
    </div>
    <p class="group">Hoje</p>
    <div class="conv-item">Nova conversa</div>
  </aside>

  <main class="empty" id="main">
    <header>
      <button class="icon-btn" id="toggle" title="Alternar menu" aria-label="Alternar menu">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
      </button>
      <button class="reset" id="reset" title="Limpar conversa">
        Limpar
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
    </header>

    <section class="conversation">
      <div class="welcome" id="welcome">
        <span class="avatar-logo big"><img src="logo.svg" alt="Logo LabTech"></span>
        <h1>Assistente Acadêmico</h1>
        <p class="intro">Assistente virtual para esclarecer dúvidas acadêmicas.</p>
        <div class="chips">
          <button data-prompt="Como funciona a rematrícula?">Rematrícula</button>
          <button data-prompt="Onde encontro o calendário acadêmico?">Calendário acadêmico</button>
          <button data-prompt="Como entro em contato com a coordenação?">Coordenação</button>
          <button data-prompt="Onde encontro informações sobre estágio?">Estágio</button>
        </div>
      </div>
      <div id="messages" class="messages"></div>
    </section>

    <footer>
      <form id="form">
        <textarea id="input" rows="1" placeholder="Digite sua dúvida acadêmica..." aria-label="Digite sua mensagem"></textarea>
        <button class="send" type="submit" aria-label="Enviar mensagem">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
        </button>
      </form>
      <p>⚡ by LabTech</p>
    </footer>
  </main>

</div>
<script src="app.js"></script>
</body>
</html>
