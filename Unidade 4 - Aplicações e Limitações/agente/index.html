<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistente Acadêmico — protótipo UDF</title>
<style>
  :root {
    --fundo: #f3f1ec; --papel: #fffdf9; --tinta: #1d2a33; --tinta-suave: #5a6872;
    --linha: #dcd7cc; --marca: #0f5c5a; --marca-clara: #e2efed; --alerta: #8a4b12; --alerta-fundo: #fbf0df;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 16px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif;
    color: var(--tinta); background: var(--fundo);
    display: flex; justify-content: center;
  }
  .app { width: 100%; max-width: 760px; height: 100%; display: flex; flex-direction: column; background: var(--papel); border-inline: 1px solid var(--linha); }
  header { padding: 18px 22px 14px; border-bottom: 1px solid var(--linha); }
  header h1 { margin: 0; font: 600 1.25rem/1.2 Georgia, "Times New Roman", serif; letter-spacing: -.01em; }
  header p { margin: 4px 0 0; font-size: .85rem; color: var(--tinta-suave); }
  .aviso { margin: 0; padding: 9px 22px; font-size: .82rem; color: var(--alerta); background: var(--alerta-fundo); border-bottom: 1px solid var(--linha); }
  #conversa { flex: 1; overflow-y: auto; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 88%; }
  .msg.estudante { align-self: flex-end; }
  .balao { padding: 11px 15px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .agente .balao { background: var(--marca-clara); border-top-left-radius: 4px; }
  .estudante .balao { background: var(--tinta); color: #fff; border-top-right-radius: 4px; }
  .opcoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 9px; }
  button { font: inherit; cursor: pointer; }
  .opcoes button { padding: 6px 13px; border: 1px solid var(--marca); border-radius: 999px; background: transparent; color: var(--marca); font-size: .88rem; }
  .opcoes button:hover { background: var(--marca); color: #fff; }
  .rodape-msg { display: flex; align-items: center; gap: 10px; margin-top: 6px; font-size: .78rem; color: var(--tinta-suave); flex-wrap: wrap; }
  .rodape-msg button { border: 0; background: none; padding: 2px 4px; color: var(--tinta-suave); text-decoration: underline; text-underline-offset: 2px; font-size: .78rem; }
  .rodape-msg button:hover { color: var(--marca); }
  .rodape-msg button[disabled] { text-decoration: none; cursor: default; opacity: .6; }
  details { margin-top: 6px; font-size: .8rem; color: var(--tinta-suave); }
  summary { cursor: pointer; width: fit-content; }
  details dl { margin: 8px 0 0; padding: 10px 12px; border-left: 3px solid var(--marca); background: #f7f5ef; display: grid; gap: 6px; }
  details dt { font-weight: 600; color: var(--tinta); text-transform: uppercase; font-size: .7rem; letter-spacing: .06em; }
  details dd { margin: 0; overflow-wrap: anywhere; }
  form { display: flex; gap: 10px; padding: 14px 22px; border-top: 1px solid var(--linha); }
  input[type=text] { flex: 1; min-width: 0; padding: 11px 14px; font: inherit; color: inherit; background: #fff; border: 1px solid var(--linha); border-radius: 10px; }
  input[type=text]:focus, button:focus-visible, summary:focus-visible { outline: 2px solid var(--marca); outline-offset: 2px; }
  form button { padding: 0 20px; border: 0; border-radius: 10px; background: var(--marca); color: #fff; font-weight: 600; }
  footer { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 0 22px 14px; font-size: .78rem; color: var(--tinta-suave); }
  footer button { border: 0; background: none; padding: 0; color: var(--tinta-suave); text-decoration: underline; text-underline-offset: 2px; font-size: .78rem; }
  @media (max-width: 520px) { header, #conversa, form, footer { padding-inline: 14px; } .aviso { padding-inline: 14px; } .msg { max-width: 96%; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Assistente Acadêmico</h1>
    <p>Protótipo de estudantes da UDF — Tendências em Ciência da Computação, Unidade 4</p>
  </header>
  <p class="aviso">Sou um assistente virtual e não substituo a secretaria. Não envie RGM, CPF ou senhas. Nada do que você escreve sai deste navegador.</p>

  <main id="conversa" aria-live="polite"></main>

  <form id="formulario" autocomplete="off">
    <input type="text" id="entrada" placeholder="Escreva a sua dúvida" aria-label="Sua mensagem" maxlength="1000">
    <button type="submit">Enviar</button>
  </form>
  <footer>
    <span>Confirme sempre nos canais oficiais da UDF.</span>
    <span><button type="button" id="nova">Nova conversa</button> · <button type="button" id="baixar">Baixar registro da sessão</button></span>
  </footer>
</div>

<script src="base-conhecimento.js"></script>
<script src="agente.js"></script>
<script>
(function () {
  'use strict';
  var agente = Agente.criarAgente();
  var conversa = document.getElementById('conversa');
  var entrada = document.getElementById('entrada');

  function elemento(tag, classe, texto) {
    var e = document.createElement(tag);
    if (classe) e.className = classe;
    if (texto != null) e.textContent = texto;
    return e;
  }

  /* O texto é inserido como texto puro; só o **negrito** vira <strong>. */
  function preencherBalao(balao, texto) {
    texto.split(/(\*\*[^*]+\*\*)/).forEach(function (parte) {
      if (/^\*\*[^*]+\*\*$/.test(parte)) balao.appendChild(elemento('strong', null, parte.slice(2, -2)));
      else balao.appendChild(document.createTextNode(parte));
    });
  }

  function mostrarEstudante(texto) {
    var m = elemento('div', 'msg estudante');
    m.appendChild(elemento('div', 'balao', texto));
    conversa.appendChild(m);
  }

  function mostrarAgente(resposta) {
    var m = elemento('div', 'msg agente');
    var balao = elemento('div', 'balao');
    preencherBalao(balao, resposta.texto);
    m.appendChild(balao);

    if (resposta.opcoes) {
      var opcoes = elemento('div', 'opcoes');
      resposta.opcoes.forEach(function (o) {
        var b = elemento('button', null, o);
        b.type = 'button';
        b.addEventListener('click', function () { enviar(o); });
        opcoes.appendChild(b);
      });
      m.appendChild(opcoes);
    }

    if (resposta.rastro) {
      var rodape = elemento('div', 'rodape-msg');
      rodape.appendChild(elemento('span', null, 'Esta resposta ajudou?'));
      [['Sim', 'util'], ['Não', 'nao_util']].forEach(function (par) {
        var b = elemento('button', null, par[0]);
        b.type = 'button';
        b.addEventListener('click', function () {
          var retorno = agente.avaliar(resposta.n, par[1]);
          rodape.querySelectorAll('button').forEach(function (x) { x.disabled = true; });
          if (retorno) { mostrarAgente({ texto: retorno }); rolar(); }
        });
        rodape.appendChild(b);
      });
      m.appendChild(rodape);

      var detalhes = elemento('details');
      detalhes.appendChild(elemento('summary', null, 'Por que recebi esta resposta?'));
      var lista = elemento('dl');
      [['Camada perceptiva', 'perceptiva'], ['Camada cognitiva', 'cognitiva'],
       ['Camada decisória', 'decisoria'], ['Camada executiva', 'executiva']].forEach(function (par) {
        lista.appendChild(elemento('dt', null, par[0]));
        lista.appendChild(elemento('dd', null, resposta.rastro[par[1]]));
      });
      detalhes.appendChild(lista);
      m.appendChild(detalhes);
    }
    conversa.appendChild(m);
  }

  function rolar() { conversa.scrollTop = conversa.scrollHeight; }

  function enviar(texto) {
    texto = texto.trim();
    if (!texto) return;
    var resposta = agente.responder(texto);
    /* Mostra a mensagem já sem os dados pessoais removidos pela camada perceptiva. */
    mostrarEstudante(agente.registro()[resposta.n - 1].mensagem || texto);
    mostrarAgente(resposta);
    rolar();
  }

  function iniciar() {
    conversa.textContent = '';
    agente.reiniciar();
    mostrarAgente(agente.saudacao());
  }

  document.getElementById('formulario').addEventListener('submit', function (ev) {
    ev.preventDefault();
    enviar(entrada.value);
    entrada.value = '';
    entrada.focus();
  });
  document.getElementById('nova').addEventListener('click', iniciar);
  document.getElementById('baixar').addEventListener('click', function () {
    var dados = JSON.stringify({ geradoEm: new Date().toISOString(), registro: agente.registro(), resumoDaSessao: agente.memoria().media }, null, 2);
    var link = document.createElement('a');
    link.href = URL.createObjectURL(new Blob([dados], { type: 'application/json' }));
    link.download = 'registro-sessao.json';
    link.click();
    URL.revokeObjectURL(link.href);
  });

  iniciar();
  entrada.focus();
})();
</script>
</body>
</html>
